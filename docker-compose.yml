services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sentinelflow
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_dev_only
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U sentinel -d sentinelflow"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://sentinel:sentinel_dev_only@db:5432/sentinelflow
      MODEL_PATH: artifacts/fraud_model.joblib
      MODEL_VERSION: baseline-v1
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    volumes: ["./artifacts:/app/artifacts"]
volumes:
  pgdata:
