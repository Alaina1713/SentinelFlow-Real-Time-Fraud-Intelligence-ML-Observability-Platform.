[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"
[project]
name="sentinelflow"
version="1.0.0"
description="Fraud intelligence and ML observability platform"
requires-python=">=3.10"
dependencies=["fastapi>=0.115","uvicorn[standard]>=0.30","pydantic>=2.8","numpy>=1.26","scikit-learn>=1.5","joblib>=1.4","sqlalchemy>=2.0","psycopg[binary]>=3.2","prometheus-client>=0.21"]
[project.optional-dependencies]
dev=["pytest>=8.0","httpx>=0.27","ruff>=0.6"]
[project.scripts]
sentinelflow-train="sentinelflow.model:main"
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src"]
